name: Meross Provisioner
slug: meross_provisioner
version: 0.1.4
description: Configure Meross Wi-Fi devices locally from Home Assistant
url: https://github.com/merchedev/ha-meross-provisioner
arch:
  - aarch64
  - amd64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:access-point-network
panel_title: Meross Provisioner
panel_admin: true
hassio_api: true
hassio_role: manager
options:
  wifi_interface: wlan0
  access_point_addon_slug: ""
  ingress_peer_ip: 172.30.32.2
schema:
  wifi_interface: str
  access_point_addon_slug: str
  ingress_peer_ip: str
